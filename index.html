<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagnóstico Digital com IA — Agência Global</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #B4BAE8;
      --bg-dark: #A5ACDD;
      --surface: #FFFFFF;
      --navy: #3D3568;
      --text-sec: #8B87A6;
      --input-bg: #F1F0F5;
      --white: #FFFFFF;
    }
    .hidden { display: none !important; }
    .step-fields { display: flex; flex-direction: column; gap: 16px; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--navy);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Decorative background waves */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      border: 2px solid var(--bg-dark);
      opacity: .4;
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 600px; height: 600px;
      top: -200px; right: -200px;
    }
    body::after {
      width: 500px; height: 500px;
      bottom: -150px; left: -150px;
    }

    #app {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    @keyframes fadeInUp { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    @keyframes scaleIn { from { opacity:0; transform:scale(0.92); } to { opacity:1; transform:scale(1); } }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.5; } }
    @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:.3; } }
    @keyframes checkmark { 0% { stroke-dashoffset:100; } 100% { stroke-dashoffset:0; } }
    @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-6px); } }

    .animate-fadeInUp { animation: fadeInUp .5s ease-out forwards; }
    .animate-fadeIn { animation: fadeIn .4s ease-out forwards; }
    .animate-scaleIn { animation: scaleIn .35s ease-out forwards; }

    /* ===== CARD ===== */
    .card {
      background: var(--surface);
      border-radius: 28px;
      box-shadow: 0 8px 32px rgba(61,53,104,.08);
      padding: 32px;
      width: 100%;
    }
    .card-sm { border-radius: 18px; padding: 20px; }

    /* ===== HEADER ===== */
    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 100px;
      background: var(--navy);
      color: var(--white);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    .header-badge .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #A78BFA;
      animation: blink 1.5s infinite;
    }
    .page-title {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 8px;
    }
    .page-subtitle {
      font-size: 14px;
      color: var(--text-sec);
      font-weight: 400;
    }

    /* ===== PROGRESS ===== */
    .progress-bar { width: 100%; height: 6px; background: var(--input-bg); border-radius: 100px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--navy); border-radius: 100px; transition: width .5s cubic-bezier(.4,0,.2,1); }
    .step-label { font-size: 12px; font-weight: 600; color: var(--text-sec); }
    .step-count { font-size: 12px; font-weight: 700; color: var(--navy); }
    .step-dots { display: flex; justify-content: center; gap: 8px; margin-top: 12px; }
    .step-dot {
      width: 10px; height: 10px; border-radius: 50%;
      border: 2px solid var(--navy);
      transition: all .3s ease;
    }
    .step-dot.active { background: var(--navy); box-shadow: 0 0 0 4px rgba(61,53,104,.15); }
    .step-dot.completed { background: var(--navy); }

    /* ===== STEP ICON ===== */
    .step-icon-row {
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 24px;
    }
    .step-icon-circle {
      width: 52px; height: 52px;
      border-radius: 16px;
      background: var(--input-bg);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .step-icon-circle svg { width: 26px; height: 26px; stroke: var(--navy); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .step-title { font-size: 18px; font-weight: 700; }
    .step-desc { font-size: 12px; color: var(--text-sec); }

    /* ===== INPUTS ===== */
    .field-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--navy);
      margin-bottom: 8px;
      letter-spacing: .01em;
    }
    .input-pill {
      width: 100%;
      padding: 14px 20px;
      background: var(--white);
      border: 2px solid var(--bg-dark);
      border-radius: 100px;
      color: var(--navy);
      font-size: 14px;
      font-family: 'Poppins', sans-serif;
      outline: none;
      transition: all .25s ease;
    }
    .input-pill:hover { border-color: var(--navy); }
    .input-pill:focus { border-color: var(--navy); box-shadow: 0 0 0 4px rgba(61,53,104,.08); }
    .input-pill::placeholder { color: var(--text-sec); }
    .input-pill.error { border-color: #E57373; }
    .input-help { font-size: 11px; color: var(--text-sec); margin-top: 6px; padding-left: 16px; }

    .textarea-pill {
      width: 100%;
      padding: 14px 20px;
      background: var(--white);
      border: 2px solid var(--bg-dark);
      border-radius: 20px;
      color: var(--navy);
      font-size: 14px;
      font-family: 'Poppins', sans-serif;
      outline: none;
      transition: all .25s ease;
      resize: vertical;
      min-height: 80px;
    }
    .textarea-pill:hover { border-color: var(--navy); }
    .textarea-pill:focus { border-color: var(--navy); box-shadow: 0 0 0 4px rgba(61,53,104,.08); }
    .textarea-pill::placeholder { color: var(--text-sec); }

    /* ===== BUTTONS ===== */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 28px;
      background: var(--navy);
      color: var(--white);
      border: none;
      border-radius: 100px;
      font-size: 14px;
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      transition: all .25s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(61,53,104,.2); }
    .btn-primary:disabled { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-primary.btn-full { width: 100%; max-width: 280px; }

    .btn-ghost {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px 24px;
      background: transparent;
      color: var(--navy);
      border: 2px solid var(--navy);
      border-radius: 100px;
      font-size: 13px;
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      transition: all .25s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-ghost:hover { background: var(--navy); color: var(--white); }
    .btn-full { width: 100%; max-width: 280px; }

    /* ===== AI TOGGLE ===== */
    .ai-toggle {
      display: flex; gap: 12px;
    }
    .ai-btn {
      flex: 1;
      padding: 20px 16px;
      border-radius: 20px;
      border: 2px solid var(--bg-dark);
      background: var(--white);
      cursor: pointer;
      text-align: center;
      transition: all .25s ease;
      font-family: 'Poppins', sans-serif;
    }
    .ai-btn .icon { font-size: 28px; margin-bottom: 6px; }
    .ai-btn .label { font-size: 13px; font-weight: 600; color: var(--navy); }
    .ai-btn:hover { border-color: var(--navy); }
    .ai-btn.selected { border-color: var(--navy); background: rgba(61,53,104,.04); }

    /* ===== SCORE ===== */
    .score-ring {
      width: 100px; height: 100px;
      border-radius: 50%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: var(--white);
      box-shadow: 0 4px 20px rgba(61,53,104,.1);
      border: 4px solid var(--navy);
      margin: 0 auto;
    }
    .score-ring .number { font-size: 36px; font-weight: 800; line-height: 1; }
    .score-ring .label { font-size: 10px; font-weight: 500; color: var(--text-sec); }

    /* ===== CATEGORY BAR ===== */
    .cat-bar { margin-bottom: 14px; }
    .cat-bar .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .cat-bar .cat-label { font-size: 12px; font-weight: 500; color: var(--navy); }
    .cat-bar .cat-val { font-size: 12px; font-weight: 700; color: var(--navy); }
    .cat-bar .track { width: 100%; height: 8px; background: var(--input-bg); border-radius: 100px; overflow: hidden; }
    .cat-bar .fill { height: 100%; background: var(--navy); border-radius: 100px; transition: width .6s ease; }

    /* ===== LIST ITEMS ===== */
    .list-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 18px;
      background: var(--input-bg);
      border-radius: 16px;
      margin-bottom: 8px;
      transition: all .2s ease;
    }
    .list-item:last-child { margin-bottom: 0; }
    .list-item .bullet {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--navy);
      margin-top: 5px;
      flex-shrink: 0;
    }
    .list-item .text { font-size: 13px; color: var(--navy); line-height: 1.5; }

    /* ===== TAG BADGE ===== */
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 12px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 600;
      background: var(--input-bg);
      color: var(--navy);
    }

    /* ===== RECOMMENDATION CARD ===== */
    .rec-card {
      background: var(--input-bg);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 10px;
    }
    .rec-card:last-child { margin-bottom: 0; }
    .rec-card .rec-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .rec-card .rec-desc { font-size: 12px; color: var(--text-sec); margin-bottom: 8px; line-height: 1.5; }
    .rec-card .rec-cost { font-size: 11px; color: var(--navy); font-weight: 500; margin-bottom: 8px; }
    .rec-card .tags { display: flex; gap: 6px; flex-wrap: wrap; }

    /* ===== SECTION HEADER ===== */
    .section-header {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 16px;
    }
    .section-header .icon-circle {
      width: 36px; height: 36px;
      border-radius: 12px;
      background: var(--input-bg);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .section-header .icon-circle svg { width: 18px; height: 18px; stroke: var(--navy); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .section-header .title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--navy); }

    /* ===== POPUP ===== */
    .popup-overlay {
      position: fixed; inset: 0;
      background: rgba(61,53,104,.35);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      z-index: 999;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .popup-card {
      background: var(--surface);
      border-radius: 28px;
      padding: 36px;
      width: 100%; max-width: 420px;
      box-shadow: 0 24px 60px rgba(61,53,104,.15);
      animation: scaleIn .3s ease-out forwards;
    }

    /* ===== BLUR BACKGROUND ===== */
    .blur-bg {
      position: fixed; inset: 0;
      filter: blur(20px);
      opacity: .12;
      pointer-events: none;
      z-index: 0;
    }

    /* ===== THANK YOU ===== */
    .thankyou-icon {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: var(--input-bg);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
    }

    /* ===== SHIMMER LOADING ===== */
    .shimmer-bar {
      background: linear-gradient(90deg, var(--input-bg) 0%, var(--bg) 50%, var(--input-bg) 100%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      height: 6px;
      border-radius: 100px;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 480px) {
      .card { padding: 24px; border-radius: 22px; }
      .page-title { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import { analyzeWithAI } from './aiAnalysis.js';
    import { generatePDF } from './report.js';

    const app = document.getElementById('app');

    // SVG Icons (line-art)
    const icons = {
      building: `<svg viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22V12h6v10"/><path d="M8 6h.01M16 6h.01M12 6h.01"/></svg>`,
      globe: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>`,
      brain: `<svg viewBox="0 0 24 24"><path d="M12 2a5 5 0 0 1 5 5v1a5 5 0 0 1-10 0V7a5 5 0 0 1 5-5z"/><path d="M9 14v4a3 3 0 0 0 6 0v-4"/><path d="M12 2v3"/></svg>`,
      check: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6"/></svg>`,
      download: `<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`,
      arrowLeft: `<svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>`,
      arrowRight: `<svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>`,
      lock: `<svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`,
      star: `<svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`,
      target: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>`,
      sparkle: `<svg viewBox="0 0 24 24"><path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"/></svg>`,
      refresh: `<svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>`,
    };

    // ========== STATE ==========
    const state = {
      step: 1,
      totalSteps: 3,
      formData: {
        companyName: '',
        segment: '',
        instagramUrl: '',
        websiteUrl: '',
        usesAI: null,
        aiDescription: ''
      },
      result: null,
      showPopup: false,
      showResults: false,
      showThankYou: false,
      isAnalyzing: false,
      leadName: '',
      leadPhone: '',
      analysisProgress: '',
      websiteData: null
    };

    // ========== SAVE DIAGNOSTIC ==========
    async function saveDiagnosticToBackend(name, phone) {
      try {
        const diagnosticData = {
          companyName: state.formData.companyName,
          segment: state.formData.segment,
          formData: { ...state.formData },
          result: { ...state.result },
          formattedData: { name, phone },
          pdfGenerated: true
        };
        await fetch('/api/diagnostics', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(diagnosticData)
        });
      } catch (e) {
        console.error('Erro ao salvar diagnóstico:', e);
      }
    }

    // ========== RENDER ==========
    function render() {
      if (state.showThankYou) return renderThankYou();
      if (state.showPopup) return renderPopup();
      if (state.showResults && state.result) return renderResults();
      return renderQuiz();
    }

    // ========== QUIZ ==========
    function renderQuiz() {
      const progress = ((state.step - 1) / state.totalSteps) * 100;
      const stepTitle = ['', 'Dados da Empresa', 'Presença Digital', 'Inteligência Artificial'];
      const stepDesc = ['', 'Como se chama e qual o setor', 'Onde sua empresa está online', 'Automação e tecnologia'];
      const stepIcon = [null, icons.building, icons.globe, icons.brain];

      app.innerHTML = `
        <div class="w-full max-w-lg animate-fadeInUp" style="max-width:520px">
          <div style="text-align:center;margin-bottom:28px">
            <div class="header-badge"><span class="dot"></span>Diagnóstico com IA</div>
            <h1 class="page-title">Análise Digital<br>por Inteligência Artificial</h1>
            <p class="page-subtitle">Nossa IA vai visitar seus links e analisar sua empresa</p>
          </div>

          <div style="margin-bottom:24px">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
              <span class="step-label">${stepTitle[state.step]}</span>
              <span class="step-count">${state.step}/${state.totalSteps}</span>
            </div>
            <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
            <div class="step-dots">
              ${[1,2,3].map(s => `<div class="step-dot ${s === state.step ? 'active' : s < state.step ? 'completed' : ''}"></div>`).join('')}
            </div>
          </div>

          <div class="card">
            <div class="step-icon-row">
              <div class="step-icon-circle">${stepIcon[state.step]}</div>
              <div>
                <div class="step-title">${stepTitle[state.step]}</div>
                <div class="step-desc">${stepDesc[state.step]}</div>
              </div>
            </div>

            <!-- Step 1 -->
            <div class="step-fields ${state.step !== 1 ? 'hidden' : ''}">
              <div>
                <label class="field-label">Nome da Empresa *</label>
                <input type="text" class="input-pill" id="companyName" value="${state.formData.companyName}" placeholder="Ex: Loja XYZ Ltda" maxlength="100">
              </div>
              <div>
                <label class="field-label">Segmento / Setor *</label>
                <input type="text" class="input-pill" id="segment" value="${state.formData.segment}" placeholder="Ex: Comércio varejista, Consultoria, Saúde" maxlength="100">
              </div>
            </div>

            <!-- Step 2 -->
            <div class="step-fields ${state.step !== 2 ? 'hidden' : ''}">
              <div>
                <label class="field-label">Link do Instagram *</label>
                <input type="url" class="input-pill" id="instagramUrl" value="${state.formData.instagramUrl}" placeholder="https://instagram.com/suaempresa">
                <p class="input-help">A IA vai analisar seu perfil, seguidores e conteúdo</p>
              </div>
              <div>
                <label class="field-label">Link do Site *</label>
                <input type="url" class="input-pill" id="websiteUrl" value="${state.formData.websiteUrl}" placeholder="https://www.seusite.com.br">
                <p class="input-help">A IA vai visitar e auditar seu site (SEO, design, tecnologia)</p>
              </div>
            </div>

            <!-- Step 3 -->
            <div class="step-fields ${state.step !== 3 ? 'hidden' : ''}">
              <div>
                <label class="field-label">A empresa usa Inteligência Artificial?</label>
                <div class="ai-toggle" style="margin-top:12px">
                  <button type="button" class="ai-btn ${state.formData.usesAI === true ? 'selected' : ''}" id="aiYes">
                    <div class="icon">🤖</div>
                    <div class="label">Sim, usamos</div>
                  </button>
                  <button type="button" class="ai-btn ${state.formData.usesAI === false ? 'selected' : ''}" id="aiNo">
                    <div class="icon">🚫</div>
                    <div class="label">Ainda não</div>
                  </button>
                </div>
              </div>
              <div id="aiDescWrapper" class="${state.formData.usesAI === true ? '' : 'hidden'}" style="margin-top:12px">
                <label class="field-label">Como vocês usam a IA?</label>
                <textarea class="textarea-pill" id="aiDescription" placeholder="Ex: Usamos ChatGPT para criar conteúdo, automação de e-mails, atendimento ao cliente...">${state.formData.aiDescription}</textarea>
              </div>
            </div>

            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:28px">
              ${state.step > 1 ? `<button class="btn-ghost" id="btnBack">${icons.arrowLeft} Voltar</button>` : '<div></div>'}
              <button class="btn-primary" id="btnNext">
                ${state.step === state.totalSteps ? `${icons.sparkle} Iniciar Análise` : `Continuar ${icons.arrowRight}`}
              </button>
            </div>
          </div>

          <p style="text-align:center;font-size:11px;color:var(--text-sec);margin-top:20px">Análise real via IA · 100% gratuito · Resultado em segundos</p>
        </div>
      `;
      attachQuizEvents();
    }

    // ========== RESULTS ==========
    function renderResults() {
      const r = state.result;
      const f = r.findings || {};
      const plan = r.actionPlan || {};
      const comp = r.competitorAnalysis || {};

      const findingCategories = [
        { key: 'site', title: 'Site', icon: '🌐', color: '#2980B9' },
        { key: 'seo', title: 'SEO / Google', icon: '🔍', color: '#8B5CF6' },
        { key: 'gmb', title: 'Google Meu Negócio', icon: '📍', color: '#2D5A3D' },
        { key: 'socialMedia', title: 'Instagram e Redes Sociais', icon: '📱', color: '#C0392B' },
        { key: 'reputation', title: 'Reputação e Avaliações', icon: '⭐', color: '#F39C12' },
      ];

      app.innerHTML = `
        <div class="w-full max-w-2xl animate-fadeInUp" style="max-width:640px">
          <div style="text-align:center;margin-bottom:32px">
            <div class="header-badge" style="background:#2D5A3D"><span class="dot" style="background:#7CFC7C"></span>Auditoria BACY Completa</div>
            <h1 class="page-title">${state.formData.companyName}</h1>
            <p class="page-subtitle">${r.expertSummary || 'Auditoria completa da presença digital'}</p>
          </div>

          <div style="text-align:center;margin-bottom:32px">
            <div class="score-ring">
              <span class="number">${r.overallScore}</span>
              <span class="label">/ 100</span>
            </div>
          </div>

          <div class="card" style="margin-bottom:20px">
            <div class="section-header">
              <div class="icon-circle">${icons.target}</div>
              <span class="title">Scores por Categoria</span>
            </div>
            ${renderBACYCategoryBars(r.categoryScores)}
          </div>

          ${findingCategories.map(cat => {
            const finding = f[cat.key];
            if (!finding) return '';
            return `
            <div class="card" style="margin-bottom:20px">
              <div class="section-header">
                <div class="icon-circle" style="background:${cat.color}15">
                  <span style="font-size:18px">${cat.icon}</span>
                </div>
                <span class="title">${cat.title}</span>
                <span class="badge badge-${finding.status === 'Bom' ? 'sent' : finding.status === 'Critico' ? 'pending' : 'viewed'}" style="margin-left:auto">${finding.status}</span>
              </div>
              <div style="font-size:12px;line-height:1.7">
                <div style="margin-bottom:8px"><strong style="color:var(--navy)">Evidência:</strong> <span style="color:var(--text-sec)">${finding.evidence || 'Não verificado'}</span></div>
                <div style="margin-bottom:8px"><strong style="color:#C0392B">Risco:</strong> <span style="color:#C0392B">${finding.risk || 'N/A'}</span></div>
                <div><strong style="color:#2D5A3D">Ação recomendada:</strong> <span style="color:#2D5A3D">${finding.action || 'N/A'}</span></div>
              </div>
            </div>`;
          }).join('')}

          ${comp.competitors?.length ? `
          <div class="card" style="margin-bottom:20px">
            <div class="section-header">
              <div class="icon-circle">${icons.target}</div>
              <span class="title">Concorrência Local</span>
            </div>
            <div style="font-size:12px;line-height:1.7">
              <div style="margin-bottom:8px"><strong>Concorrentes:</strong> ${comp.competitors.join(', ')}</div>
              ${comp.whatTheyDoBetter ? `<div style="margin-bottom:8px"><strong>O que fazem melhor:</strong> ${comp.whatTheyDoBetter}</div>` : ''}
              ${comp.identifiedGap ? `<div><strong>Gap identificado:</strong> ${comp.identifiedGap}</div>` : ''}
            </div>
          </div>` : ''}

          ${r.paidAds ? `
          <div class="card" style="margin-bottom:20px">
            <div class="section-header">
              <div class="icon-circle" style="background:rgba(61,53,104,.08)">${icons.sparkle}</div>
              <span class="title">Publicidade Paga</span>
            </div>
            <div style="font-size:12px;line-height:1.7">
              <div style="margin-bottom:4px"><strong>Status:</strong> ${r.paidAds.status}</div>
              ${r.paidAds.evidence ? `<div>${r.paidAds.evidence}</div>` : ''}
            </div>
          </div>` : ''}

          ${(plan.now?.length || plan.shortTerm?.length || plan.strategic?.length) ? `
          <div class="card" style="margin-bottom:20px">
            <div class="section-header">
              <div class="icon-circle" style="background:rgba(61,53,104,.08)">${icons.target}</div>
              <span class="title">Plano de Ação Priorizado</span>
            </div>
            ${plan.now?.length ? `
              <div style="margin-bottom:12px">
                <div style="font-size:11px;font-weight:700;color:#2D5A3D;margin-bottom:6px">⚡ Resolver agora</div>
                ${plan.now.map((a, i) => `<div class="list-item"><div class="bullet" style="background:#2D5A3D"></div><span class="text">${a}</span></div>`).join('')}
              </div>` : ''}
            ${plan.shortTerm?.length ? `
              <div style="margin-bottom:12px">
                <div style="font-size:11px;font-weight:700;color:#F39C12;margin-bottom:6px">📅 Médio prazo (1-3 meses)</div>
                ${plan.shortTerm.map((a, i) => `<div class="list-item"><div class="bullet" style="background:#F39C12"></div><span class="text">${a}</span></div>`).join('')}
              </div>` : ''}
            ${plan.strategic?.length ? `
              <div>
                <div style="font-size:11px;font-weight:700;color:var(--navy);margin-bottom:6px">🎯 Estratégico</div>
                ${plan.strategic.map((a, i) => `<div class="list-item"><div class="bullet" style="background:var(--navy)"></div><span class="text">${a}</span></div>`).join('')}
              </div>` : ''}
          </div>` : ''}

          ${r.whereWeCanHelp ? `
          <div class="card" style="margin-bottom:20px;border:2px solid var(--navy)">
            <div class="section-header">
              <div class="icon-circle" style="background:var(--navy)">${icons.check}</div>
              <span class="title" style="color:var(--navy)">Onde a BACY pode ajudar</span>
            </div>
            <p style="font-size:13px;color:var(--navy);line-height:1.6">${r.whereWeCanHelp}</p>
          </div>` : ''}

          <div style="text-align:center;padding:20px 0">
            <button class="btn-primary btn-full" id="btnDownload">${icons.download} Baixar Relatório Completo (PDF)</button>
            <p style="font-size:11px;color:var(--text-sec);margin-top:10px">Preencha seu nome e telefone para gerar o PDF</p>
          </div>
          <p style="text-align:center;font-size:11px;color:var(--text-sec);margin-top:16px">Auditoria gerada por IA — BACY Agência</p>
        </div>
      `;
      document.getElementById('btnDownload').addEventListener('click', () => { state.showPopup = true; render(); });
    }

    function renderBACYCategoryBars(scores) {
      const cats = [
        { label: 'Site', val: scores?.site || 50, icon: '🌐' },
        { label: 'SEO / Google', val: scores?.seo || 50, icon: '🔍' },
        { label: 'Google Meu Negócio', val: scores?.gmb || 50, icon: '📍' },
        { label: 'Redes Sociais', val: scores?.socialMedia || 50, icon: '📱' },
        { label: 'Reputação', val: scores?.reputation || 50, icon: '⭐' },
      ];
      return cats.map(c => `
        <div class="cat-bar">
          <div class="row">
            <span class="cat-label">${c.icon} ${c.label}</span>
            <span class="cat-val">${c.val}/100</span>
          </div>
          <div class="track"><div class="fill" style="width:${c.val}%"></div></div>
        </div>
      `).join('');
    }

    // ========== POPUP ==========
    function renderPopup() {
      app.innerHTML = `
        <div class="blur-bg">
          <div style="max-width:640px;margin:0 auto;padding:24px">
            <div style="text-align:center;margin-bottom:32px"><h1 class="page-title" style="font-size:22px">Diagnóstico de ${state.formData.companyName}</h1></div>
            <div class="card" style="height:300px"></div>
          </div>
        </div>
        <div class="popup-overlay" id="blurOverlay">
          <div class="popup-card">
            <div style="text-align:center;margin-bottom:28px">
              <div class="thankyou-icon" style="width:64px;height:64px;margin:0 auto 16px">
                <span style="font-size:28px">🔐</span>
              </div>
              <h2 style="font-size:20px;font-weight:700;margin-bottom:4px">Seu diagnóstico está pronto!</h2>
              <p style="font-size:13px;color:var(--text-sec)">Informe seus dados para acessar o relatório</p>
            </div>
            <div style="display:flex;flex-direction:column;gap:14px">
              <div>
                <label class="field-label">Seu nome completo *</label>
                <input type="text" class="input-pill" id="leadName" placeholder="Ex: João da Silva" maxlength="100" value="${state.leadName}">
              </div>
              <div>
                <label class="field-label">Telefone / WhatsApp *</label>
                <input type="tel" class="input-pill" id="leadPhone" placeholder="Ex: (11) 98888-7777" maxlength="20" value="${state.leadPhone}">
              </div>
            </div>
            <div style="display:flex;flex-direction:column;gap:10px;margin-top:24px">
              <button class="btn-primary btn-full" id="btnConfirmDownload">${icons.download} Acessar Relatório e Baixar PDF</button>
            </div>
            <p style="text-align:center;font-size:11px;color:var(--text-sec);margin-top:16px">Seus dados são usados apenas para personalizar o relatório</p>
          </div>
        </div>
      `;

      document.getElementById('btnConfirmDownload').addEventListener('click', async () => {
        const name = document.getElementById('leadName').value.trim();
        const phone = document.getElementById('leadPhone').value.trim();
        if (!name) { document.getElementById('leadName').classList.add('error'); document.getElementById('leadName').focus(); return; }
        if (!phone) { document.getElementById('leadPhone').classList.add('error'); document.getElementById('leadPhone').focus(); return; }

        state.leadName = name;
        state.leadPhone = phone;
        const btn = document.getElementById('btnConfirmDownload');
        btn.textContent = 'Gerando PDF...';
        btn.disabled = true;

        // Salvar diagnóstico no backend primeiro
        try {
          await saveDiagnosticToBackend(name, phone);
        } catch (e) {
          console.error('Erro ao salvar diagnóstico:', e);
        }

        try {
          console.log('DEBUG: state.result =', state.result);
          console.log('DEBUG: state.formData =', state.formData);
          const fileName = generatePDF(state.result, state.formData, name, phone);
          console.log('DEBUG: fileName =', fileName);
          if (fileName) {
            state.showPopup = false;
            state.showResults = true;
            render();
          } else {
            btn.textContent = '📥 Acessar Relatório e Baixar PDF';
            btn.disabled = false;
            alert('Erro ao gerar PDF. Verifique o console (F12).');
          }
        } catch (err) {
          console.error('PDF error:', err);
          alert('Erro ao gerar PDF: ' + err.message);
          btn.textContent = '📥 Acessar Relatório e Baixar PDF';
          btn.disabled = false;
        }
      });
    }

    // ========== THANK YOU ==========
    function renderThankYou() {
      app.innerHTML = `
        <div class="w-full max-w-lg animate-fadeIn" style="max-width:480px">
          <div class="card" style="text-align:center;padding:48px 32px">
            <div class="thankyou-icon">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--navy)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <path d="M8 12l3 3 5-6" style="stroke-dasharray:100;animation:checkmark .6s ease forwards .3s"/>
              </svg>
            </div>
            <h2 style="font-size:24px;font-weight:700;margin-bottom:6px">Obrigado, ${state.leadName}!</h2>
            <p style="font-size:13px;color:var(--text-sec);margin-bottom:24px">Seu diagnóstico digital foi gerado e o download já iniciou.</p>

            <div class="card card-sm" style="margin-bottom:24px;background:var(--input-bg)">
              <p style="font-size:11px;color:var(--text-sec);margin-bottom:12px">Resumo para <strong style="color:var(--navy)">${state.formData.companyName}</strong></p>
              <div style="display:flex;align-items:center;justify-content:center;gap:24px">
                <div style="text-align:center">
                  <div style="font-size:32px;font-weight:800;color:var(--navy)">${state.result.overallScore}</div>
                  <div style="font-size:11px;color:var(--text-sec)">Score Geral</div>
                </div>
                <div style="width:1px;height:36px;background:var(--bg-dark)"></div>
                <div style="text-align:center">
                  <div style="font-size:32px;font-weight:800;color:var(--navy)">${state.result.aiRecommendations?.length || 0}</div>
                  <div style="font-size:11px;color:var(--text-sec)">Recomendações IA</div>
                </div>
                <div style="width:1px;height:36px;background:var(--bg-dark)"></div>
                <div style="text-align:center">
                  <div style="font-size:32px;font-weight:800;color:var(--navy)">${state.result.strengths?.length || 0}</div>
                  <div style="font-size:11px;color:var(--text-sec)">Pontos Fortes</div>
                </div>
              </div>
            </div>

            <p style="font-size:13px;color:var(--navy);margin-bottom:6px">Nosso time entrará em contato para apresentar como podemos ajudar a melhorar esses números.</p>
            <p style="font-size:11px;color:var(--text-sec);margin-bottom:24px">Fique atento ao seu WhatsApp!</p>
            <button class="btn-primary btn-full" onclick="location.reload()">${icons.refresh} Fazer Novo Diagnóstico</button>
          </div>
            <p style="text-align:center;font-size:11px;color:var(--text-sec);margin-top:20px">© ${new Date().getFullYear()} Agência Global — Investigação Digital com IA</p>
            <p style="text-align:center;font-size:10px;margin-top:8px"><a href="/admin.html" style="color:var(--text-sec);text-decoration:none;opacity:.5">Painel Admin</a></p>
        </div>
      `;
    }

    // ========== QUIZ EVENTS ==========
    function attachQuizEvents() {
      const bind = (id, prop) => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('input', e => { state.formData[prop] = e.target.value; e.target.classList.remove('error'); });
      };
      bind('companyName', 'companyName');
      bind('segment', 'segment');
      bind('instagramUrl', 'instagramUrl');
      bind('websiteUrl', 'websiteUrl');

      const aiYes = document.getElementById('aiYes');
      const aiNo = document.getElementById('aiNo');
      if (aiYes) aiYes.addEventListener('click', () => { state.formData.usesAI = true; render(); });
      if (aiNo) aiNo.addEventListener('click', () => { state.formData.usesAI = false; state.formData.aiDescription = ''; render(); });

      const aiDesc = document.getElementById('aiDescription');
      if (aiDesc) aiDesc.addEventListener('input', e => { state.formData.aiDescription = e.target.value; });

      document.getElementById('btnNext').addEventListener('click', () => {
        if (!validateStep()) return;
        if (state.step < state.totalSteps) { state.step++; render(); }
        else startAnalysis();
      });

      const btnBack = document.getElementById('btnBack');
      if (btnBack) btnBack.addEventListener('click', () => { if (state.step > 1) { state.step--; render(); } });
    }

    // ========== VALIDATION ==========
    function validateStep() {
      if (state.step === 1) {
        if (!state.formData.companyName.trim()) { document.getElementById('companyName').classList.add('error'); document.getElementById('companyName').focus(); return false; }
        if (!state.formData.segment.trim()) { document.getElementById('segment').classList.add('error'); document.getElementById('segment').focus(); return false; }
      }
      if (state.step === 2) {
        if (!state.formData.instagramUrl.trim()) { document.getElementById('instagramUrl').classList.add('error'); document.getElementById('instagramUrl').focus(); return false; }
        if (!state.formData.websiteUrl.trim()) { document.getElementById('websiteUrl').classList.add('error'); document.getElementById('websiteUrl').focus(); return false; }
      }
      if (state.step === 3) {
        if (state.formData.usesAI === null) {
          document.getElementById('aiYes').style.borderColor = '#E57373';
          document.getElementById('aiNo').style.borderColor = '#E57373';
          return false;
        }
      }
      return true;
    }

    // ========== AI ANALYSIS ==========
    async function startAnalysis() {
      state.isAnalyzing = true;
      const phases = [
        'Conectando com a IA...',
        'Visitando seu website...',
        'Analisando conteúdo e estrutura...',
        'Verificando SEO e performance...',
        'Analisando perfil Instagram...',
        'Pesquisando mercado e concorrência...',
        'Gerando recomendações personalizadas...',
        'Montando seu relatório...'
      ];

      let phaseIdx = 0;
      const showPhase = () => {
        if (!state.isAnalyzing) return;
        state.analysisProgress = phases[phaseIdx] || phases[phases.length - 1];
        phaseIdx = Math.min(phaseIdx + 1, phases.length - 1);
        const el = document.getElementById('analysisPhase');
        if (el) el.textContent = state.analysisProgress;
      };

      app.innerHTML = `
        <div class="w-full max-w-lg animate-fadeInUp" style="max-width:480px">
          <div class="card" style="text-align:center;padding:48px 32px">
            <div style="width:72px;height:72px;border-radius:50%;background:var(--input-bg);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;animation:float 3s ease-in-out infinite">
              <div style="width:36px;height:36px;border:4px solid var(--bg-dark);border-top-color:var(--navy);border-radius:50%;animation:spin .8s linear infinite"></div>
            </div>
            <h2 style="font-size:20px;font-weight:700;margin-bottom:6px">Nossa IA está analisando...</h2>
            <p style="font-size:13px;color:var(--text-sec);margin-bottom:4px" id="analysisPhase">${phases[0]}</p>
            <p style="font-size:11px;color:var(--text-sec);margin-bottom:24px">Isso pode levar até 60 segundos</p>
            <div class="shimmer-bar" style="width:100%"></div>
          </div>
        </div>
      `;

      const phaseInterval = setInterval(showPhase, 3500);

      try {
        const result = await analyzeWithAI(state.formData);
        clearInterval(phaseInterval);
        state.result = result;
        state.showPopup = true;
        state.isAnalyzing = false;
        render();
      } catch (err) {
        clearInterval(phaseInterval);
        console.error('Analysis error:', err);
        state.isAnalyzing = false;
        app.innerHTML = `
          <div class="w-full max-w-lg animate-fadeInUp" style="max-width:480px">
            <div class="card" style="text-align:center;padding:48px 32px">
              <div style="width:72px;height:72px;border-radius:50%;background:#FDEAEA;display:flex;align-items:center;justify-content:center;margin:0 auto 20px">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#C0392B" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
              </div>
              <h2 style="font-size:20px;font-weight:700;margin-bottom:6px">Erro na Análise</h2>
              <p style="font-size:13px;color:var(--text-sec);margin-bottom:6px">Não foi possível conectar com a IA. Verifique sua conexão e tente novamente.</p>
              <p style="font-size:11px;color:var(--text-sec);margin-bottom:24px">Erro: ${err.message}</p>
              <button class="btn-primary btn-full" onclick="location.reload()">${icons.refresh} Tentar Novamente</button>
            </div>
          </div>
        `;
      }
    }

    // ========== INIT ==========
    render();
  </script>
</body>
</html>
